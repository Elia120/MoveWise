<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Move Wise | Property Compliance Tracker</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --brand-green: #204d35;
      --brand-purple: #71307b;
      --off-white: #faf9f7;
      --white: #ffffff;
      --line: rgba(28,27,24,0.08);
      --ink: #1c1b18;
      --mid: #8a8880;
      --danger: #bc2c2c;
      --success: #166534;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Jost', sans-serif; background: var(--off-white); color: var(--ink); line-height: 1.6; }

    /* NAV & FOOTER */
    nav {
      height: 80px; padding: 0 5%; display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,0.98); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 1000;
    }
    .nav-logo img { height: 60px; width: auto; }
    
    footer { background: var(--white); padding: 4rem 5%; border-top: 1px solid var(--line); text-align: center; margin-top: 5rem; }
    .footer-logo { height: 50px; margin-bottom: 1rem; opacity: 0.8; }

    /* LAYOUT */
    .container { max-width: 1400px; margin: 40px auto; padding: 0 5%; }
    .dashboard-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; flex-wrap: wrap; gap: 20px; }
    h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--brand-green); }

    /* BUTTONS */
    .btn { padding: 0.8rem 1.5rem; border-radius: 4px; font-weight: 600; cursor: pointer; border: none; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.1em; transition: 0.3s; }
    .btn-main { background: var(--brand-green); color: white; }
    .btn-main:hover { background: var(--brand-purple); }
    .btn-outline { background: transparent; border: 1px solid var(--line); color: var(--ink); }

    /* TABLE */
    .table-card { background: white; border: 1px solid var(--line); border-radius: 4px; overflow-x: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
    table { width: 100%; border-collapse: collapse; text-align: left; min-width: 1100px; }
    th { padding: 1.2rem; background: #f8f8f6; font-size: 0.7rem; text-transform: uppercase; color: var(--mid); letter-spacing: 0.1em; border-bottom: 2px solid var(--line); }
    td { padding: 1.2rem; border-bottom: 1px solid var(--line); font-size: 0.85rem; vertical-align: top; }

    /* ALERTS & PILLS */
    .expiry-alert { font-size: 0.6rem; font-weight: 800; color: var(--danger); display: block; margin-bottom: 4px; text-transform: uppercase; }
    .status-pill { font-size: 0.65rem; padding: 2px 8px; border-radius: 20px; font-weight: 600; display: inline-block; margin-bottom: 5px; }
    .valid { background: #f0fdf4; color: var(--success); }
    .urgent { background: #fef2f2; color: var(--danger); }

    .action-links { display: flex; gap: 10px; margin-top: 5px; }
    .action-link { font-size: 0.7rem; font-weight: 600; color: var(--brand-purple); cursor: pointer; text-decoration: none; border: none; background: none; }
    .action-link:hover { text-decoration: underline; }

    /* MOBILE SLIDE-OUT DRAWER */
    .overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); 
      backdrop-filter: blur(4px); display: none; z-index: 2000; justify-content: flex-end;
    }
    .drawer {
      width: 100%; max-width: 500px; background: white; height: 100%; padding: 3rem; 
      overflow-y: auto; box-shadow: -10px 0 30px rgba(0,0,0,0.1);
      transform: translateX(100%); transition: transform 0.3s ease-in-out;
    }
    .overlay.active { display: flex; }
    .overlay.active .drawer { transform: translateX(0); }

    /* MODAL */
    .modal {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: white; padding: 2rem; border-radius: 8px; z-index: 3000; width: 90%; max-width: 450px;
      display: none; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    .form-grp { margin-bottom: 1.2rem; }
    .form-grp label { display: block; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; margin-bottom: 0.5rem; color: var(--brand-green); }
    input { width: 100%; padding: 0.8rem; border: 1px solid var(--line); background: var(--off-white); font-family: inherit; outline: none; }
    input:focus { border-color: var(--brand-purple); }

    @media (max-width: 600px) {
        .drawer { padding: 2rem 1.5rem; }
        h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

<nav>
  <a href="#" class="nav-logo"><img src="LogoGrok3C.png" alt="Move Wise"></a>
  <div id="nav-user" style="display:none">
    <span id="user-display" style="font-size:0.75rem; font-weight:600; margin-right:15px; color:var(--mid)"></span>
    <button class="btn btn-outline" style="padding: 0.4rem 0.8rem;" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="container" style="max-width:400px; margin-top:100px;">
    <div class="table-card" style="padding:2.5rem;">
        <h2 style="font-family:'Playfair Display'; margin-bottom:2rem; text-align:center; color:var(--brand-purple)">Agent Portal</h2>
        <div class="form-grp"><label>Email</label><input type="email" id="auth-email"></div>
        <div class="form-grp"><label>Password</label><input type="password" id="auth-password"></div>
        <button class="btn btn-main" style="width:100%" onclick="login()">Login</button>
    </div>
</div>

<!-- MAIN DASHBOARD -->
<main id="app-content" class="container" style="display:none">
  <div class="dashboard-header">
    <div>
      <h1>Compliance Portfolio</h1>
      <p style="color:var(--mid)">Manage dates and certificates for your managed properties.</p>
    </div>
    <button class="btn btn-main" onclick="openDrawer()">+ Add Property</button>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Property & Tenant</th>
          <th>Gas Safety</th>
          <th>Elec (EICR)</th>
          <th>EPC</th>
          <th>Tenancy Period</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</main>

<!-- HISTORY MODAL -->
<div id="modal-bg" class="overlay" style="background:rgba(0,0,0,0.6); display:none;" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="modal-title" style="font-family:'Playfair Display'; margin-bottom:1.5rem; color:var(--brand-purple)">History</h3>
    <div id="history-list" style="max-height: 350px; overflow-y: auto;"></div>
    <button class="btn btn-outline" style="width:100%; margin-top:1.5rem" onclick="closeModal()">Close</button>
  </div>
</div>

<!-- SLIDE OUT DRAWER -->
<div class="overlay" id="drawer-overlay" onclick="closeDrawer()">
    <div class="drawer" onclick="event.stopPropagation()">
        <h2 id="drawer-title" style="font-family:'Playfair Display'; margin-bottom:2rem; color:var(--brand-green)">Property Details</h2>
        <form id="prop-form" onsubmit="saveProperty(event)">
            <input type="hidden" id="edit-id">
            <div class="form-grp"><label>Address *</label><input type="text" id="f-address" required></div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px">
                <div class="form-grp"><label>Postcode</label><input type="text" id="f-postcode"></div>
                <div class="form-grp"><label>Tenant Name</label><input type="text" id="f-tenant"></div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px">
                <div class="form-grp"><label>Phone</label><input type="text" id="f-phone"></div>
                <div class="form-grp"><label>Email</label><input type="email" id="f-email"></div>
            </div>
            <hr style="border:0; border-top:1px solid var(--line); margin: 1.5rem 0">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px">
                <div class="form-grp"><label>Gas Expiry</label><input type="date" id="f-gas"></div>
                <div class="form-grp"><label>Elec Expiry</label><input type="date" id="f-elec"></div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px">
                <div class="form-grp"><label>EPC Expiry</label><input type="date" id="f-epc"></div>
                <div class="form-grp"><label>Tenancy End</label><input type="date" id="f-end"></div>
            </div>
            <button type="submit" class="btn btn-main" style="width:100%; margin-top:1rem">Save Record</button>
        </form>
    </div>
</div>

<footer>
    <img src="LogoGrok3C.png" class="footer-logo" alt="Move Wise">
    <p style="font-size:0.8rem; color:var(--mid)">&copy; 2025 Move Wise Estate Agents. Internal Compliance System.</p>
</footer>

<script>
  const SUPABASE_URL = "https://bthrwzqcfrqftfszxjih.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_IC5aFRMa1KXJsV74r4Lh7A_pQQAAo79";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let properties = [];

  const fmtDate = (iso) => iso ? iso.split('-').reverse().join('.') : '-';
  
  function getStatus(dateStr) {
    if (!dateStr) return { class: 'urgent', label: 'MISSING', warn: true };
    const diff = Math.ceil((new Date(dateStr) - new Date()) / (86400000));
    if (diff < 0) return { class: 'urgent', label: 'EXPIRED', warn: true };
    if (diff <= 30) return { class: 'urgent', label: 'RENEW SOON', warn: true };
    return { class: 'valid', label: 'VALID', warn: false };
  }

  // AUTH
  async function login() {
    const { error } = await _supabase.auth.signInWithPassword({
      email: document.getElementById('auth-email').value,
      password: document.getElementById('auth-password').value
    });
    if (error) alert(error.message); else checkSession();
  }
  async function logout() { await _supabase.auth.signOut(); location.reload(); }

  async function checkSession() {
    const { data: { session } } = await _supabase.auth.getSession();
    if (session) {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-content').style.display = 'block';
      document.getElementById('nav-user').style.display = 'flex';
      document.getElementById('user-display').innerText = session.user.email;
      loadProperties();
    }
  }

  async function loadProperties() {
    const { data } = await _supabase.from('Properties').select('*').order('id', { ascending: false });
    properties = data || [];
    renderTable();
  }

  function renderTable() {
    const body = document.getElementById('table-body');
    body.innerHTML = properties.map(p => {
      return `
        <tr>
          <td>
            <strong>${p.address}</strong><br><small style="color:var(--mid)">${p.postcode || ''}</small>
            <div style="margin-top:10px; font-size:0.75rem">
                <b>${p.tenant_name || 'No Tenant'}</b><br>${p.phone || ''}
            </div>
          </td>
          ${['gas', 'elec', 'epc'].map(type => renderCell(p, type)).join('')}
          <td>
            <small>End: ${fmtDate(p.tenancy_end)}</small>
            <div class="action-links">
                ${p.tenancy_pdf_path ? `<button class="action-link" onclick="viewFile('${p.tenancy_pdf_path}')">View</button>` : ''}
                <label class="action-link">+ Add <input type="file" hidden onchange="uploadFile('${p.id}', 'tenancy', this)"></label>
                <button class="action-link" style="color:var(--mid)" onclick="showHistory(${p.id}, 'tenancy')">Hist</button>
            </div>
          </td>
          <td>
            <button class="action-link" onclick="editProp(${p.id})">Edit</button><br>
            <button class="action-link" style="color:var(--danger); margin-top:10px" onclick="deleteProp(${p.id})">Delete</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  function renderCell(p, type) {
    const dateKey = type === 'epc' ? 'epc_expiry' : `${type}_cert_expiry`;
    const pathKey = `${type}_pdf_path`;
    const stat = getStatus(p[dateKey]);
    return `
      <td>
        ${stat.warn ? `<span class="expiry-alert">! Renewal Required</span>` : ''}
        <span class="status-pill ${stat.class}">${stat.label}: ${fmtDate(p[dateKey])}</span>
        <div class="action-links">
            ${p[pathKey] ? `<button class="action-link" onclick="viewFile('${p[pathKey]}')">View</button>` : ''}
            <label class="action-link">+ Add <input type="file" hidden onchange="uploadFile('${p.id}', '${type}', this)"></label>
            <button class="action-link" style="color:var(--mid)" onclick="showHistory(${p.id}, '${type}')">Hist</button>
        </div>
      </td>
    `;
  }

  // FILE OPERATIONS
  async function viewFile(path) {
    const { data } = await _supabase.storage.from('certificates').createSignedUrl(path, 60);
    window.open(data.signedUrl, '_blank');
  }

  async function uploadFile(id, type, input, historyId = null) {
    const file = input.files[0];
    if (!file) return;
    const path = `${id}/${type}_${Date.now()}.pdf`;
    const { error } = await _supabase.storage.from('certificates').upload(path, file);
    if (error) return alert("Upload failed");

    if (historyId) {
        // REPLACE in history
        await _supabase.from('CertificateHistory').update({ file_path: path }).eq('id', historyId);
        closeModal();
    } else {
        // ADD NEW
        const field = type === 'tenancy' ? 'tenancy_pdf_path' : `${type}_pdf_path`;
        const prop = properties.find(x => x.id == id);
        const expiry = prop[type === 'tenancy' ? 'tenancy_end' : (type === 'epc' ? 'epc_expiry' : type+'_cert_expiry')];
        
        await _supabase.from('Properties').update({ [field]: path }).eq('id', id);
        await _supabase.from('CertificateHistory').insert({ property_id: id, cert_type: type, file_path: path, expiry_date: expiry });
    }
    loadProperties();
  }

  // HISTORY
  async function showHistory(id, type) {
    const { data } = await _supabase.from('CertificateHistory').select('*').eq('property_id', id).eq('cert_type', type).order('created_at', {ascending:false});
    document.getElementById('modal-title').innerText = `${type.toUpperCase()} History`;
    document.getElementById('history-list').innerHTML = data.length ? data.map(h => `
        <div style="padding:1rem 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center">
            <div><small>${new Date(h.created_at).toLocaleDateString()}</small><br><b>Exp: ${fmtDate(h.expiry_date)}</b></div>
            <div>
                <button class="action-link" onclick="viewFile('${h.file_path}')">View</button>
                <label class="action-link" style="margin-left:10px">Replace <input type="file" hidden onchange="uploadFile(${id}, '${type}', this, ${h.id})"></label>
                <button class="action-link" style="color:var(--danger); margin-left:10px" onclick="deleteHistory(${h.id})">Del</button>
            </div>
        </div>
    `).join('') : '<p style="padding:1rem 0; color:var(--mid)">No historical records found.</p>';
    document.getElementById('modal-bg').style.display = 'flex';
  }

  async function deleteHistory(hid) {
    if (confirm("Delete this history record?")) {
        await _supabase.from('CertificateHistory').delete().eq('id', hid);
        closeModal();
        loadProperties();
    }
  }

  // DRAWER
  function openDrawer() {
    document.getElementById('prop-form').reset();
    document.getElementById('edit-id').value = '';
    document.getElementById('drawer-title').innerText = "Add New Property";
    document.getElementById('drawer-overlay').classList.add('active');
  }
  function closeDrawer() { document.getElementById('drawer-overlay').classList.remove('active'); }
  function closeModal() { document.getElementById('modal-bg').style.display = 'none'; }

  function editProp(id) {
    const p = properties.find(x => x.id == id);
    document.getElementById('edit-id').value = p.id;
    document.getElementById('f-address').value = p.address;
    document.getElementById('f-postcode').value = p.postcode;
    document.getElementById('f-tenant').value = p.tenant_name;
    document.getElementById('f-phone').value = p.phone || '';
    document.getElementById('f-email').value = p.email || '';
    document.getElementById('f-gas').value = p.gas_cert_expiry;
    document.getElementById('f-elec').value = p.elec_cert_expiry;
    document.getElementById('f-epc').value = p.epc_expiry;
    document.getElementById('f-end').value = p.tenancy_end;
    document.getElementById('drawer-title').innerText = "Edit Property Details";
    document.getElementById('drawer-overlay').classList.add('active');
  }

  async function saveProperty(e) {
    e.preventDefault();
    const id = document.getElementById('edit-id').value;
    const payload = {
        address: document.getElementById('f-address').value,
        postcode: document.getElementById('f-postcode').value,
        tenant_name: document.getElementById('f-tenant').value,
        phone: document.getElementById('f-phone').value,
        email: document.getElementById('f-email').value,
        gas_cert_expiry: document.getElementById('f-gas').value || null,
        elec_cert_expiry: document.getElementById('f-elec').value || null,
        epc_expiry: document.getElementById('f-epc').value || null,
        tenancy_end: document.getElementById('f-end').value || null
    };

    if (id) {
        await _supabase.from('Properties').update(payload).eq('id', id);
    } else {
        const { data: { user } } = await _supabase.auth.getUser();
        payload.user_id = user.id;
        await _supabase.from('Properties').insert([payload]);
    }
    closeDrawer(); loadProperties();
  }

  async function deleteProp(id) {
    if (confirm("Permanently delete this property?")) {
        await _supabase.from('Properties').delete().eq('id', id);
        loadProperties();
    }
  }

  window.onload = checkSession;
</script>
</body>
</html>
