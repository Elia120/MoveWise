<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compliance Tracker | Move Wise</title>
  
  <!-- Fonts & Supabase SDK -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white:   #ffffff;
      --off:     #faf9f7;
      --pale:    #f3f1ed;
      --ink:     #1c1b18;
      --brand-green:  #204d35; 
      --brand-purple: #71307b; 
      --brand-purple-dark: #4a1f51; 
      --brand-teal:   #2d8080; 
      --mid:     #8a8880;
      --light:   #c8c5be;
      --line:    rgba(28,27,24,0.08);
      --danger:  #bc2c2c;
    }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--off);
      color: var(--ink);
      line-height: 1.6;
    }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 300;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 5%; height: 80px;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
    }
    .nav-logo img { height: 80px; width: auto; display: block; }
    .nav-user { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mid); }

    .btn-logout {
      background: none; border: 1px solid var(--line); padding: 0.5rem 1rem;
      font-size: 0.7rem; font-family: 'Jost'; text-transform: uppercase;
      letter-spacing: 0.1em; cursor: pointer; transition: 0.3s; margin-left: 1rem;
    }

    /* AUTH SECTION */
    .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .auth-card {
      background: white; width: 100%; max-width: 450px; padding: 3rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.05); border-radius: 2px;
    }
    .auth-card h2 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 1.5rem; color: var(--brand-purple); text-align: center; }

    /* APP LAYOUT */
    .app-wrap { max-width: 1300px; margin: 120px auto 8rem; padding: 0 5%; }
    .card-panel { background: white; padding: 2.5rem; border: 1px solid var(--line); margin-bottom: 3rem; }
    .vrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 1.5rem; }
    
    .input-grp label { display: block; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; color: var(--brand-green); }
    input { width: 100%; padding: 0.8rem; background: var(--off); border: 1px solid var(--line); font-family: inherit; font-size: 0.9rem; }

    .cert-block { background: var(--pale); padding: 1.5rem; border-top: 3px solid var(--brand-teal); }
    .btn-primary {
      background: var(--brand-green); color: white; border: none; padding: 1rem 2rem;
      text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; cursor: pointer;
      width: 100%; font-size: 0.85rem;
    }

    /* TABLE */
    .table-container { overflow-x: auto; background: white; border: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; }
    th { background: var(--brand-purple-dark); color: white; padding: 1.2rem; text-align: left; font-size: 0.7rem; text-transform: uppercase; }
    td { padding: 1.2rem; border-bottom: 1px solid var(--line); vertical-align: top; }

    .status-badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 2px; font-weight: 600; text-transform: uppercase; }
    .status-expired { background: #fee2e2; color: #991b1b; }
    .status-warning { background: #fef3c7; color: #92400e; }
    .status-ok { background: #f0fdf4; color: #166534; }

    footer { background: var(--pale); padding: 5rem 0 3rem; border-top: 1px solid var(--line); margin-top: 5rem; }
    .ft-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 3rem; max-width: 1200px; margin: 0 auto; padding: 0 5%; }
  </style>
</head>
<body>

<nav>
  <a href="#" class="nav-logo"><img src="LogoGrok3C.png" alt="Move Wise"></a>
  <div id="nav-auth-info" style="display:none;">
    <span class="nav-user" id="user-display"></span>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- AUTH SECTION -->
<div id="auth-section" class="auth-container">
  <div class="auth-card">
    <h2 id="auth-title">Agent Login</h2>
    <div class="input-grp" style="margin-bottom:1rem;">
      <label>Email Address</label>
      <input type="email" id="auth-email" placeholder="agent@move-wise.uk">
    </div>
    <div class="input-grp" style="margin-bottom:2rem;">
      <label>Password</label>
      <input type="password" id="auth-password" placeholder="••••••••">
    </div>
    
    <div id="login-actions">
      <button class="btn-primary" onclick="login()">Sign In</button>
      <p style="text-align:center; font-size:0.8rem; margin-top:1.5rem; color:var(--mid);">
        New Agent? <a href="javascript:void(0)" onclick="toggleAuth(true)" style="color:var(--brand-purple); font-weight:600;">Create Account</a>
      </p>
    </div>
    
    <div id="signup-actions" style="display:none;">
      <button class="btn-primary" onclick="signUp()">Register Account</button>
      <p style="text-align:center; font-size:0.8rem; margin-top:1.5rem; color:var(--mid);">
        Existing user? <a href="javascript:void(0)" onclick="toggleAuth(false)" style="color:var(--brand-purple); font-weight:600;">Back to Login</a>
      </p>
    </div>
  </div>
</div>

<!-- MAIN APP SECTION -->
<main id="app-section" class="app-wrap" style="display:none;">
  <h1 style="font-family: 'Playfair Display', serif; font-size: 2.5rem;">Compliance Dashboard</h1>
  <p style="color: var(--mid); margin-bottom: 2rem;">Track property certificates across your portfolio.</p>

  <div class="card-panel">
    <form id="property-form" onsubmit="addProperty(event)">
      <div class="vrow">
        <div class="input-grp"><label>Address *</label><input type="text" id="address" required></div>
        <div class="input-grp"><label>Postcode</label><input type="text" id="postcode"></div>
      </div>
      <div class="vrow">
        <div class="cert-block">
          <label>Gas Expiry</label><input type="date" id="gas-expiry">
          <label style="margin-top:10px">Upload PDF</label><input type="file" id="gas-pdf" accept=".pdf">
        </div>
        <div class="cert-block" style="border-top-color:var(--brand-purple)">
          <label>Elec Expiry</label><input type="date" id="elec-expiry">
          <label style="margin-top:10px">Upload PDF</label><input type="file" id="elec-pdf" accept=".pdf">
        </div>
        <div class="cert-block" style="border-top-color:var(--brand-green)">
          <label>EPC Expiry</label><input type="date" id="epc-expiry">
          <label style="margin-top:10px">Upload PDF</label><input type="file" id="epc-pdf" accept=".pdf">
        </div>
      </div>
      <button type="submit" class="btn-primary">Save Property</button>
    </form>
  </div>

  <div class="table-container" id="properties-list"></div>
</main>

<footer>
  <div class="ft-grid">
    <div><img src="LogoGrok3C.png" alt="Move Wise" style="height:80px;"></div>
    <div style="font-size:0.8rem; color:var(--mid);">&copy; 2025 Move Wise Estate Agents</div>
  </div>
</footer>

<script>
  // SUPABASE CONFIG
  const SUPABASE_URL = "https://bthrwzqcfrqftfszxjih.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0aHJ3enFjZnRqZnRmc3p4amloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMDQ0MjQsImV4cCI6MjA5NDY4MDQyNH0.G87x4O8wR1ZKmPPDJl-n8BgJNbAHBJQf7kEPy9kL5TQ";
  
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 1. TOGGLE BETWEEN LOGIN & SIGNUP
  function toggleAuth(isSignUp) {
    document.getElementById('auth-title').innerText = isSignUp ? "Create Agent Account" : "Agent Login";
    document.getElementById('login-actions').style.display = isSignUp ? "none" : "block";
    document.getElementById('signup-actions').style.display = isSignUp ? "block" : "none";
  }

  // 2. AUTH FUNCTIONS
  async function signUp() {
    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-password').value;
    const { data, error } = await _supabase.auth.signUp({ email, password });
    if (error) alert(error.message);
    else alert("Success! Check your email for a confirmation link.");
  }

  async function login() {
    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-password').value;
    const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
    if (error) alert(error.message);
    else showApp(data.user);
  }

  async function logout() {
    await _supabase.auth.signOut();
    location.reload();
  }

  function showApp(user) {
    document.getElementById('auth-section').style.display = 'none';
    document.getElementById('app-section').style.display = 'block';
    document.getElementById('nav-auth-info').style.display = 'flex';
    document.getElementById('user-display').innerText = user.email;
    fetchProperties();
  }

  // 3. DATA FUNCTIONS
  async function addProperty(e) {
    e.preventDefault();
    const { data: { user } } = await _supabase.auth.getUser();
    
    // Simplified insert for testing
    const { error } = await _supabase.from('Properties').insert([{
      address: document.getElementById('address').value,
      postcode: document.getElementById('postcode').value,
      gas_cert_expiry: document.getElementById('gas-expiry').value || null,
      elec_cert_expiry: document.getElementById('elec-expiry').value || null,
      epc_expiry: document.getElementById('epc-expiry').value || null
    }]);

    if (error) alert(error.message);
    else { fetchProperties(); document.getElementById('property-form').reset(); }
  }

  async function fetchProperties() {
    const { data, error } = await _supabase.from('Properties').select('*').order('created_at', { ascending: false });
    if (error) return;

    let html = `<table><tr><th>Address</th><th>Gas</th><th>Elec</th><th>EPC</th></tr>`;
    data.forEach(prop => {
      html += `<tr>
        <td><strong>${prop.address}</strong><br><small>${prop.postcode || ''}</small></td>
        <td>${prop.gas_cert_expiry || '-'}</td>
        <td>${prop.elec_cert_expiry || '-'}</td>
        <td>${prop.epc_expiry || '-'}</td>
      </tr>`;
    });
    html += `</table>`;
    document.getElementById('properties-list').innerHTML = html;
  }

  // Session check on load
  window.onload = async () => {
    const { data: { user } } = await _supabase.auth.getUser();
    if (user) showApp(user);
  };
</script>

</body>
</html>
